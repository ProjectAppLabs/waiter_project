# Odoo como motor de POS de ProjectApp Smart Restaurant.
#
# Los puertos se atan a la interfaz host-only de VirtualBox: el navegador corre
# en la maquina anfitriona, no dentro de la VM.
services:
  db:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:19
    env_file: .env   # SMTP_* para el correo saliente (ver provisioning/configure-mail.sh)
    depends_on:
      - db
    ports:
      - "${WAITER_HOST:-192.168.56.10}:8069:8069"
      - "${WAITER_HOST:-192.168.56.10}:8072:8072"
    volumes:
      - odoo-data:/var/lib/odoo
      - ../addons:/mnt/extra-addons:ro
      - ./odoo.conf:/etc/odoo/odoo.conf:ro

volumes:
  db-data:
  odoo-data:
