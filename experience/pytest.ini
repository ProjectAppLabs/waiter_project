[pytest]
DJANGO_SETTINGS_MODULE = experience_project.settings
python_files = test_*.py
testpaths = experience_app/tests tenancy/tests accounts/tests notifications/tests catalog/tests inventory/tests sales/tests
norecursedirs = venv
addopts = -ra -m "not contract"
markers =
    contract: corre contra el Odoo real del compose; falla si no responde
    sistema_de_diseno_real: no neutraliza la regla «primero el sistema de diseño» del MCP
